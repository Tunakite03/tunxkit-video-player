name: Release

# Pushing a version tag (e.g. v0.3.1) builds the app for macOS and Windows and
# publishes a GitHub release once every build has uploaded its installers.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # One draft for the whole run. Letting each build create it raced: parallel jobs
  # each made their own draft, and only one of them was published.
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - id: draft
        run: |
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag \
            --title "Tunxkit Player $TAG" --notes "$NOTES"
          id=$(gh api "repos/$REPO/releases" \
            --jq "[.[] | select(.tag_name == \"$TAG\" and .draft)][0].id")
          if [[ -z "$id" || "$id" == "null" ]]; then
            echo "::error::no draft release found for $TAG after creating it"
            exit 1
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          NOTES: |
            Installers for macOS (Apple Silicon: `aarch64`, Intel: `x64`) and Windows (`.msi` or `-setup.exe`).

            The macOS app is not notarized. If macOS refuses to open it, go to System Settings → Privacy & Security and choose "Open Anyway".

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      # Builds the installers and uploads them to the run's draft release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          REPO: ${{ github.repository }}
