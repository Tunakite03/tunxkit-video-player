<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Hand-drawn watercolor gradient wash -->
    <linearGradient id="tk-sketch-wash" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="tk-paper-texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Soft organic watercolor blob (slightly irregular hand-painted silhouette) -->
  <path d="M 22,23 C 27,16 45,17 58,16 C 72,15 84,20 87,32 C 90,44 87,63 82,73 C 77,83 62,86 47,85 C 31,84 17,79 15,67 C 13,54 15,32 22,23 Z"
        fill="url(#tk-sketch-wash)" opacity="0.92" filter="url(#tk-paper-texture)" />

  <!-- Doodled TV / Monitor Antenna -->
  <path d="M 38,18 C 44,14 48,10 52,7" fill="none" stroke="#1e1b4b" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="52.5" cy="6.5" r="2.2" fill="#f59e0b" stroke="#1e1b4b" stroke-width="1.8" />
  <path d="M 62,18 C 58,13 54,9 50,6" fill="none" stroke="#1e1b4b" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="0.5 3" opacity="0.75" />

  <!-- Hand-drawn monitor frame: Primary ink stroke -->
  <path d="M 22,22 C 34,20.8 66,21.2 78,22 C 84.5,22.5 87,25.4 87.2,31.5 C 87.6,43 87,61.5 87.2,70.2 C 87.4,76.5 84.2,79.2 78,79.6 C 64,80.2 34,79.8 22,79.2 C 16,78.6 13.3,75.8 13,69.8 C 12.6,58 12.8,34 13.2,29.2 C 13.6,24.2 16.4,22.4 22,22 Z"
        fill="#0f172a" fill-opacity="0.25" stroke="#1e1b4b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Secondary sketchy reinforcement stroke (authentic hand-sketched ink wobble) -->
  <path d="M 24,20.8 C 38,21.8 62,22.1 76,21.5 C 84.2,22.1 88.4,24.2 88.6,33.2 C 88.9,47 88.2,63 88.2,71.2 C 87.9,77.8 85.2,80.8 76,81.1 C 60,81.5 32,80.8 20,80.3 C 14.5,80.1 12,76.8 11.8,68.2 C 11.5,55 12,32 12.8,27 C 13.3,23.4 16,21 23,20.8"
        fill="none" stroke="#312e81" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />

  <!-- Film reel / spool doodles at the top bar -->
  <circle cx="28" cy="27" r="3.2" fill="none" stroke="#1e1b4b" stroke-width="1.5" />
  <circle cx="28" cy="27" r="1" fill="#1e1b4b" />
  <circle cx="72" cy="27" r="3.2" fill="none" stroke="#1e1b4b" stroke-width="1.5" />
  <circle cx="72" cy="27" r="1" fill="#1e1b4b" />

  <!-- Hand-drawn central Play Triangle (with expressive hand-inked curves) -->
  <path d="M 40,36 C 41.5,35.2 43.8,36.4 45.4,37.8 L 65.8,50.2 C 67.5,51.4 68.2,53 68.2,54.4 C 68.2,55.8 67.4,57.3 65.6,58.4 L 45.5,70.8 C 43.6,72 41.4,72.6 39.8,71.8 C 38,71 37.8,68.8 38,66.5 L 38.6,41 C 38.6,38.6 38.8,36.5 40,36 Z"
        fill="#ffffff" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Play triangle sketchy double stroke -->
  <path d="M 39.2,34.8 L 67.2,52.5 C 69,53.8 68.8,56.2 67,57.5 L 39.8,73 C 37.8,74.2 36.6,72.8 36.8,69.8 L 37.4,37.8 C 37.5,35.2 38.5,34 39.2,34.8 Z"
        fill="none" stroke="#4338ca" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Hand-drawn sketchy hatch shading inside Play button -->
  <path d="M 43,45 L 49,49 M 43,53 L 55,60 M 43,61 L 52,66"
        fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />

  <!-- Whimsical hand-drawn sparkles & doodle stars -->
  <!-- Top Right Sparkle -->
  <path d="M 88,12 C 88,15.5 89.8,17.5 93,17.5 C 89.8,17.5 88,19.5 88,23 C 88,19.5 86.2,17.5 83,17.5 C 86.2,17.5 88,15.5 88,12 Z"
        fill="#f59e0b" stroke="#1e1b4b" stroke-width="1" />
  <!-- Bottom Left Tiny Sparkle -->
  <path d="M 10,83 C 10,85 11.2,86.2 13,86.2 C 11.2,86.2 10,87.4 10,89.5 C 10,87.4 8.8,86.2 7,86.2 C 8.8,86.2 10,85 10,83 Z"
        fill="#06b6d4" stroke="#1e1b4b" stroke-width="0.8" />
  <!-- Small ink dots -->
  <circle cx="82" cy="74" r="1.3" fill="#1e1b4b" />
  <circle cx="21" cy="74" r="1.1" fill="#1e1b4b" />
</svg>
